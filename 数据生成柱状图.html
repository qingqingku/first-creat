<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>第二页面</title>
    <style>
        .box0{
            height: 100px;
            background-color: pink;
        } 
        .box0{
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        let box1 = document.document
        let arr = new Array();
        for(let i = 0;i < 4;i++){
            arr.push(+prompt(`请输入第${i}个值`));
        }
        document.write("<div class='box'>");
        for(let i = 0;i < arr.length;i++){
            document.write(
                `<div class="box0" style="width:${arr[i]}px;margin:10px">
                <span>${arr[i]}</span>
                <br>
                <span>第${i+1}季度</span>
                </div>`
            );
        }
        document.write("</div>");
    </script>
</body>
